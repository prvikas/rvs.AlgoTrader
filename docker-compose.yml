version: '3.9'

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: algotrader-postgres
    environment:
      POSTGRES_DB: algotrader
      POSTGRES_USER: algotrader
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-algotrader_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U algotrader -d algotrader"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: algotrader-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-algotrader_dev}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:-algotrader_dev}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: algotrader-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: algotrader
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-algotrader_dev}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 15s
      timeout: 10s
      retries: 5

  vault:
    image: hashicorp/vault:1.17
    container_name: algotrader-vault
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_TOKEN:-dev-token}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK
    command: server -dev

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: algotrader-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'

  grafana:
    image: grafana/grafana:11.1.0
    container_name: algotrader-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: algotrader-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      - POSTGRES__CONNECTIONSTRING=Host=postgres;Database=algotrader;Username=algotrader;Password=${POSTGRES_PASSWORD:-algotrader_dev}
      - REDIS__CONNECTIONSTRING=redis:6379,password=${REDIS_PASSWORD:-algotrader_dev}
      - RABBITMQ__HOST=rabbitmq
      - RABBITMQ__USERNAME=algotrader
      - RABBITMQ__PASSWORD=${RABBITMQ_PASSWORD:-algotrader_dev}
      - VAULT__ADDRESS=http://vault:8200
      - VAULT__TOKEN=${VAULT_TOKEN:-dev-token}
      - JWT__SECRET=${JWT_SECRET:-dev-jwt-secret-minimum-32-chars-long}
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:
