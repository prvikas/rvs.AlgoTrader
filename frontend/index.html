<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>rvs.AlgoTrader</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; }
      body { background: var(--c-bg, #0F1117); color: var(--c-text, #E8EDF5); font-family: 'Inter', system-ui, -apple-system, sans-serif; }
      #root { height: 100%; display: flex; flex-direction: column; }
      .num, td.num, .metric-value { font-family: 'JetBrains Mono', monospace; }
      /* Smooth theme transitions on non-layout properties */
      *, *::before, *::after { transition: background-color 0.18s ease, border-color 0.18s ease, color 0.12s ease; }
      /* But NOT on layout-affecting or animation properties */
      input, select, textarea, button { transition: background-color 0.18s ease, border-color 0.18s ease, color 0.12s ease; }
    </style>
    <script>
      // Pre-apply theme from localStorage before React loads to prevent FOUC.
      // Only sets the base bg/text — ThemeContext sets the full token set after mount.
      ;(function () {
        var bgs   = { dark: '#0F1117', warm: '#F7F3EE', cool: '#F4F6FA' }
        var texts = { dark: '#E8EDF5', warm: '#1A1410', cool: '#0F1520' }
        var t = localStorage.getItem('rvs_theme') || 'dark'
        if (!bgs[t]) t = 'dark'
        var r = document.documentElement
        r.style.setProperty('--c-bg',   bgs[t])
        r.style.setProperty('--c-text', texts[t])
        document.body && (document.body.style.background = bgs[t])
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
  </body>
</html>
